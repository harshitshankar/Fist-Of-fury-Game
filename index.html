<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Fist of Fury — online multiplayer fighting game with voice chat, unique fighters and arenas." />
    <title>🥊 Fist of Fury — Online Fighting Arena</title>
    <!-- 
      AdSense is loaded ONLY on the real website, NOT inside the Android WebView app.
      The Capacitor native app uses AdMob (see App.tsx) — mixing AdSense inside
      a WebView violates Google AdSense policy and can get the account banned.
    -->
    <script>
      // Only inject the AdSense script when running on a real browser (website),
      // never inside the Capacitor/Cordova WebView (Android app).
      (function() {
        var isNativeApp = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
        if (!isNativeApp) {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6063172558757532';
          s.crossOrigin = 'anonymous';
          document.head.appendChild(s);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
